# GitHub Actions: runs the backend tests on every pull request and on every push to main.
# The result shows on the PR (✓ or ✗) and in the README badge.
# The tests don't call Google or Supabase, so no secrets are needed here.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
